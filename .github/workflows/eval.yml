# 评估门禁（E1）：在真库 + 真实 embedding 供应商上跑 RAG 消融，基线 recall 低于
# vars.APP_EVAL_MIN_RECALL 时任务失败（app.eval.min-recall 门禁使进程非零退出）。
#
# 前置配置（仓库 Settings）：
#   Secrets: EMBEDDING_API_KEY（必填，缺省时任务告警跳过而非失败——PR 流程不被阻塞）
#            SILICONFLOW_API_KEY（可选，embedding 备用供应商）
#            APP_LLM_API_KEY（可选，跑含改写的全量消融列时需要；默认 skip-rewrite=true 不需要）
#   Variables: APP_EVAL_MIN_RECALL（门禁阈值，参考基线 0.969，建议 0.95）
#
# 手动触发：Actions → Eval gate → Run workflow。日常由 schedule 每晚跑一次。

name: Eval gate

on:
  workflow_dispatch:
  schedule:
    - cron: "0 21 * * *" # 每日 UTC 21:00（北京时间 05:00）

jobs:
  eval:
    name: RAG evaluation gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ragent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/ragent
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      APP_EVAL_ENABLED: "true"
      APP_EVAL_EXIT_AFTER_RUN: "true"
      APP_EVAL_SKIP_REWRITE: "true"
      APP_EVAL_MIN_RECALL: ${{ vars.APP_EVAL_MIN_RECALL || '0.95' }}
      # spring-boot:run 的工作目录默认是模块 basedir（ragent-bootstrap，见启动日志
      # "started by runner in .../ragent-bootstrap"），评估集在仓库根的 data/eval/，需上跳一级
      APP_EVAL_SET_PATH: ../data/eval/eval-set.json
      EMBEDDING_API_KEY: ${{ secrets.EMBEDDING_API_KEY }}
      SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
      # skip-rewrite=true 时评估链路不调 chat 模型，但 ChatClient 是必装 bean
      # （InfraAiAutoConfiguration 在 chat 候选全空时抛 IllegalStateException，上下文启动失败
      # ——首跑踩坑：进程退出 1 且评估 runner 根本没执行）。占位 key 仅用于让 bean 能装配。
      APP_LLM_API_KEY: ${{ secrets.APP_LLM_API_KEY || 'dummy-not-used-skip-rewrite' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Skip when no embedding key configured
        if: env.EMBEDDING_API_KEY == '' && env.SILICONFLOW_API_KEY == ''
        run: |
          echo "::warning::EMBEDDING_API_KEY / SILICONFLOW_API_KEY 均未配置，评估门禁跳过（在仓库 Secrets 配置后生效）"

      # service: postgres 起的是全新空库，不建表/不灌语料会必然失败：
      #   ① 不建表 → DatabaseSchemaInitializer 启动时执行
      #      ALTER TABLE document_chunk ... 报 relation does not exist → 启动失败；
      #   ② 不灌语料 → 评估集（kbId=2）与库脱节，evaluationSetInSyncWithDb 判脱节并中止。
      # seed.sql 内含 embedding，CI 无需调用 embedding 供应商灌数据（只用于查询向量化）。
      # ON_ERROR_STOP=1 保证建表/灌数失败立即红灯，不被后续语句掩盖。
      - name: Initialize schema and seed evaluation corpus
        if: env.EMBEDDING_API_KEY != '' || env.SILICONFLOW_API_KEY != ''
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d ragent -v ON_ERROR_STOP=1 -q -f database.sql
          psql -h 127.0.0.1 -U postgres -d ragent -v ON_ERROR_STOP=1 -q -f data/eval/seed.sql
          psql -h 127.0.0.1 -U postgres -d ragent -t -A \
            -c "SELECT 'documents=' || count(*) FROM document" \
            -c "SELECT 'chunks=' || count(*) FROM document_chunk" \
            -c "SELECT 'kb=' || id || ' owner=' || coalesce(owner_user_id::text, 'NULL') FROM knowledge_base WHERE id = 2"

      - name: Run evaluation (boot app; eval runner exits the process when done)
        if: env.EMBEDDING_API_KEY != '' || env.SILICONFLOW_API_KEY != ''
        run: |
          # spring-boot:run 的 goal 会应用到 reactor 全部模块：parent 上没有 mainClass 直接失败
          # （首跑踩坑）。先 install 兄弟模块到 ~/.m2，再只对 ragent-bootstrap 单模块 run。
          mvn -B -pl ragent-bootstrap -am install -DskipTests
          mvn -B -pl ragent-bootstrap spring-boot:run \
            -Dspring-boot.run.jvmArguments="-Dspring.main.web-application-type=none" \
            2>&1 | tee eval.log
          MVN=${PIPESTATUS[0]}
          # tee 吃掉退出码，用 PIPESTATUS 取 mvn 的真实退出码：
          # 门禁阈值失败 / tripwire 中止都经启动失败或非零应用退出落到这里
          test $MVN -eq 0
          # 双保险：即便 run goal 不传播应用退出码，「评估跑完」的标志行必须存在
          grep -q "RAG evaluation finished" eval.log

      # 消融汇总以 notice annotation 输出：公开仓库的 annotations API 可免认证读取，
      # 评估结果（recall/precision 数字）可远程获取，不必等日志粘贴
      - name: Publish ablation summaries
        if: always()
        run: |
          [ -f eval.log ] || exit 0
          grep -E 'ablation|评估门禁|RAG evaluation aborted' eval.log | head -20 | while IFS= read -r line; do
            echo "::notice title=Eval::${line:0:500}"
          done

      - name: Failure diagnostics
        if: failure()
        run: |
          [ -f eval.log ] || exit 0
          grep -E '^\[ERROR\]' eval.log | head -10 | while IFS= read -r line; do
            echo "::error title=Eval-Maven::${line:0:700}"
          done
          # 启动失败/评估中止的原因在日志尾部（Spring 失败块、runner aborted 行），
          # 分块转 ::error:: annotation 以便远程读取
          python3 - <<'PY'
          log = open('eval.log', encoding='utf-8', errors='replace').read()
          tail = log[-5600:]
          for i in range(0, len(tail), 690):
              chunk = tail[i:i+690].replace('\n', ' | ')
              print(f"::error title=Eval-tail-{i//690}::{chunk}")
          PY

      - name: Upload eval log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-log
          path: eval.log
          retention-days: 14
