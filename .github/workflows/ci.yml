name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build & test
        run: |
          mvn -B -pl ragent-bootstrap -am test 2>&1 | tee mvn.log
          # tee 会吃掉退出码，用 PIPESTATUS 取 mvn 的真实退出码
          test ${PIPESTATUS[0]} -eq 0

      # 失败诊断以 ::error:: annotation 形式输出：surefire 失败块与 Maven 错误行
      # 在公开仓库的 check-run annotations API 上可免认证读取，CI 故障可远程定位
      - name: Failure diagnostics
        if: failure()
        run: |
          DIR=ragent-bootstrap/target/surefire-reports
          if [ -d "$DIR" ]; then
            for f in "$DIR"/*.txt; do
              grep -qE '<<< (FAILURE|ERROR)!' "$f" || continue
              cls=$(basename "$f" .txt)
              msg=$(grep -A 18 -E '<<< (FAILURE|ERROR)!' "$f" | tr '\n' ' ' | head -c 700)
              echo "::error title=Surefire: $cls::$msg"
            done
          fi
          if [ -f mvn.log ]; then
            grep -E '^\[ERROR\]' mvn.log | head -12 | while IFS= read -r line; do
              echo "::error title=Maven::${line:0:700}"
            done
          fi

  frontend:
    name: Frontend build (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: miniagent-front
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: miniagent-front/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
