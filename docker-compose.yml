services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ragent-postgres
    environment:
      POSTGRES_DB: ragent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 首次启动自动建表（8 张表 + pgvector 扩展 + 默认知识库种子数据）
      - ./database.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ragent"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ragent-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: .
    container_name: ragent-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # 容器网络内固定指向服务名（覆盖 .env 里的 127.0.0.1）
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ragent
      SPRING_REDIS_HOST: redis
      # CORS：浏览器经前端 nginx 同源访问 /api，无需额外来源
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:8081}
    volumes:
      - uploads:/app/uploads
      - appdata:/app/data
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build: ./miniagent-front
    container_name: ragent-frontend
    depends_on:
      - backend
    ports:
      - "8081:80"
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  uploads:
  appdata:
